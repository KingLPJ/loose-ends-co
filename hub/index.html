<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loose Ends Co.</title>
<meta name="description" content="Simple, useful digital tools and templates for everyday life.">
<style>
  :root{
    --teal:#1F5F5B;
    --teal-dark:#164744;
    --paper:#F7F5F0;
    --paper-dim:#e7e4dc;
    --ink:#1a1a1a;
    --ink-dim:#5c6664;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:Georgia,'Times New Roman',serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 20px 40px;
  }
  .wrap{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .logo{
    width:72px;
    height:72px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:20px;
    box-shadow:0 1px 0 rgba(0,0,0,0.04);
  }
  h1{
    font-size:28px;
    line-height:1.15;
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  p.tag{
    font-family:Arial,Helvetica,sans-serif;
    color:var(--ink-dim);
    font-size:15px;
    line-height:1.5;
    margin:0 0 32px;
    max-width:340px;
  }
  .buttons{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  a.btn{
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:18px 20px;
    border-radius:14px;
    text-decoration:none;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.01em;
    transition:transform .12s ease, opacity .12s ease;
  }
  a.btn:active{transform:scale(0.98)}
  a.btn.primary{
    background:var(--teal);
    color:var(--paper);
  }
  a.btn.primary:hover{background:var(--teal-dark)}
  a.btn.secondary{
    background:#fff;
    color:var(--ink);
    border:1.5px solid var(--paper-dim);
  }
  a.btn.secondary:hover{border-color:var(--teal)}
  .btn small{
    font-family:Arial,Helvetica,sans-serif;
    font-weight:400;
    opacity:0.8;
    font-size:12px;
  }
  .note{
    font-family:Arial,Helvetica,sans-serif;
    color:var(--ink-dim);
    font-size:12.5px;
    margin:18px 0 36px;
    line-height:1.5;
  }
  .more{
    width:100%;
    border-top:1px solid var(--paper-dim);
    padding-top:22px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  a.more-link{
    font-family:Arial,Helvetica,sans-serif;
    color:var(--ink-dim);
    font-size:14px;
    text-decoration:none;
    padding:8px;
  }
  a.more-link:hover{color:var(--teal)}
  footer{
    margin-top:auto;
    padding-top:40px;
    font-family:Georgia,serif;
    font-weight:700;
    color:var(--teal);
    font-size:14px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="https://assets-2-prod.whop.com/public/uploads/2026-09-06/669c5720-341f-4b98-8930-55051986ed38/image.png" alt="Loose Ends Co. logo">
    <h1>Loose Ends Co.</h1>
    <p class="tag">Simple, useful digital tools and templates for everyday life &mdash; AI prompt packs, planners and trackers you can download and use in minutes.</p>

    <div class="buttons">
      <a class="btn primary" href="https://whop.com/looseendsco/products" target="_blank" rel="noopener">
        Shop on Whop
      </a>
      <a class="btn secondary" href="https://kinglpj.github.io/loose-ends-co/" target="_blank" rel="noopener">
        Shop on Polar
      </a>
    </div>
    <p class="note">Same six products either way &mdash; pick whichever checkout you prefer.</p>

    <div class="more">
      <a class="more-link" href="https://www.pinterest.com/looseendsco/" target="_blank" rel="noopener">Follow on Pinterest &rarr;</a>
    </div>
  </div>

  <footer>Loose Ends Co.</footer>
</body>
</html>
